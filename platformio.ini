; PlatformIO project configuration for the ESP32 CYD (ESP32-2432S028R)
; nearby-flights display - Arduino/C++ port of the MicroPython version at
; /Users/dean/Projects/Python/flight-tracker/cyd_nearby_flights.py
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; no_ota: 2 MiB app slot + ~1.9 MiB LittleFS-capable data partition. The default
; table gave a 1.25 MiB app slot plus an equally large OTA slot this project never
; uses (firmware is always flashed over USB) and was down to ~138 KB free. NVS
; stays at the same offset/size (0x9000/0x5000) in both tables, so the soak
; counters and the route-provider budget counter survive the change.
board_build.partitions = no_ota.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; After every build, merge bootloader+partitions+app into one flashable image for web/config.html's
; in-browser installer. The shared hook (../cyd-common/tools/build_firmware_bundle.py, see its docstring)
; also writes the manifest and the "classic" script files, so the page works opened straight from disk.
; Every environment below extends this one, so each of them opts out by clearing the name - only a
; production build is ever offered by the page.
extra_scripts = post:../cyd-common/tools/build_firmware_bundle.py
custom_fw_bundle_name = flight-tracker
custom_fw_bundle_board = cyd                 ; key in the manifest; matches "board" in the hello reply
custom_fw_bundle_formats = classic

; ../cyd-common's subdirectories (ascii, time-sync, watchdog-manager, ...) are each their own
; PlatformIO library - lib_extra_dirs auto-discovers them, and the dependency finder pulls in only
; the ones actually #included by a given build (so e.g. [env:native] below gets ascii/time-sync's
; portable .cpp files but not watchdog-manager's Arduino-only one).
lib_extra_dirs = ../cyd-common

lib_deps =
	bodmer/TFT_eSPI @ ^2.5.43
	bblanchon/ArduinoJson @ ^7.2.0
	lvgl/lvgl @ ~9.6.0
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

build_flags =
	-Wall
	-Wextra
	-Isrc
	-Iinclude
	-D LV_CONF_INCLUDE_SIMPLE=1
	-D USER_SETUP_LOADED=1
	-D ILI9341_2_DRIVER=1
	-D TFT_INVERSION_ON=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=4
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D SPI_FREQUENCY=40000000
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	; mbedTLS's own handshake call chain (entropy/DRBG/SHA) is itself several
	; KB deep on the stack - the default 8KB loopTask stack overflowed during
	; testing once our own buffers were on top of it (see OpenSkyClient.cpp).
	; Fixed the stack-local buffers too, but keeping this bump as headroom.
	; NOTE: must override ARDUINO_LOOP_STACK_SIZE, not CONFIG_ARDUINO_LOOP_STACK_SIZE -
	; cores/esp32/main.cpp includes Arduino.h (which pulls in sdkconfig.h,
	; redefining CONFIG_ARDUINO_LOOP_STACK_SIZE back to 8192) before it
	; checks that macro, silently discarding a -D override of it.
	-D ARDUINO_LOOP_STACK_SIZE=16384

; Bench builds for force-testing the watchdog / diagnostics recovery paths on
; real hardware: adds the _hang, _blocknet, _slownet and _resetdiag serial
; commands (see src/diag/SerialCommands.h). Shorten thresholds with
; PLATFORMIO_BUILD_FLAGS, e.g.
;   PLATFORMIO_BUILD_FLAGS="-DSTALL_RESET_MS=20000UL" pio run -e esp32dev-test -t upload
; Never flash this as the deployed firmware.
[env:esp32dev-test]
extends = env:esp32dev
custom_fw_bundle_name =
build_flags =
	${env:esp32dev.build_flags}
	-D TEST_HOOKS=1

; Real data plus the screenshot capture command (see src/diag/SerialCommands.h) and the bench hooks.
;   pio run -e esp32dev-shot -t upload ; python3 tools/screenshot.py out.png
; Never flash this as the deployed firmware.
[env:esp32dev-shot]
extends = env:esp32dev
custom_fw_bundle_name =
build_flags =
	${env:esp32dev.build_flags}
	-D SCREEN_CAPTURE=1
	-D TEST_HOOKS=1

; Scripted scenes instead of live traffic, for display work (see src/flight/SimFlights.h), plus the screenshot
; command. python3 tools/screenshot.py out.png --sim   captures every scene. Never deploy this.
[env:esp32dev-sim]
extends = env:esp32dev-shot
build_flags =
	${env:esp32dev-shot.build_flags}
	-D SIM_DATA=1

; Native Unity tests for the pure logic - no board, no network, no Arduino runtime: pio test -e native
; build_src_filter lists exactly the files with no Arduino/HTTPClient/WiFiClientSecure dependency: pure
; math/decision logic (FlightMath, DestinationVerifier, FlightSelector's non-network half,
; AirportTable/Data, CallsignList - Phase 7's tracked-callsign validation) plus the JSON-decoding halves
; split out of each network client
; (AdsbdbParse/AeroDataBoxParse/OpenSkyParse - see those files' headers) so real captured API payloads
; can be tested without a live network call. Ascii and Iso8601 moved to ../cyd-common (their own test
; suites live there now - lib_deps below pulls the compiled .cpp in automatically wherever a filtered
; file here #includes their header, e.g. AdsbdbParse.cpp's Ascii::sanitize call). FlightSelectorEnrich.cpp
; (the network-calling half) and the *Client.cpp HTTP-fetch halves are deliberately excluded - see
; ../mlb-board's [env:native] for the pattern this mirrors.
[env:native]
platform = native
test_build_src = yes
build_flags = -Isrc
lib_extra_dirs = ../cyd-common
lib_deps = bblanchon/ArduinoJson @ ^7.2.0
build_src_filter =
	+<config.cpp>
	+<config/CallsignList.cpp>
	+<config/RadarAirportList.cpp>
	+<flight/FlightMath.cpp>
	+<flight/FlightSelector.cpp>
	+<flight/DestinationVerifier.cpp>
	+<data/AirportTable.cpp>
	+<data/AirportData.cpp>
	+<network/AdsbdbParse.cpp>
	+<network/AeroDataBoxParse.cpp>
	+<network/OpenSkyParse.cpp>
	+<input/Gesture.cpp>
	+<render/RadarMath.cpp>
