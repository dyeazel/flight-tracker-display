; PlatformIO project configuration for the ESP32 CYD (ESP32-2432S028R)
; nearby-flights display - Arduino/C++ port of the MicroPython version at
; /Users/dean/Projects/Python/flight-tracker/cyd_nearby_flights.py
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
	bodmer/TFT_eSPI @ ^2.5.43
	bblanchon/ArduinoJson @ ^7.2.0

build_flags =
	-Wall
	-Wextra
	-Isrc
	-D USER_SETUP_LOADED=1
	-D ILI9341_2_DRIVER=1
	-D TFT_INVERSION_ON=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=4
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D SPI_FREQUENCY=40000000
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	; mbedTLS's own handshake call chain (entropy/DRBG/SHA) is itself several
	; KB deep on the stack - the default 8KB loopTask stack overflowed during
	; testing once our own buffers were on top of it (see OpenSkyClient.cpp).
	; Fixed the stack-local buffers too, but keeping this bump as headroom.
	; NOTE: must override ARDUINO_LOOP_STACK_SIZE, not CONFIG_ARDUINO_LOOP_STACK_SIZE -
	; cores/esp32/main.cpp includes Arduino.h (which pulls in sdkconfig.h,
	; redefining CONFIG_ARDUINO_LOOP_STACK_SIZE back to 8192) before it
	; checks that macro, silently discarding a -D override of it.
	-D ARDUINO_LOOP_STACK_SIZE=16384
